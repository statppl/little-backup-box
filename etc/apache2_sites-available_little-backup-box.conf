<VirtualHost *:80 *:8080>
	DocumentRoot /var/www/little-backup-box/

	<Location />
		include /etc/apache2/includes/password.conf
	</Location>

	<Directory /var/www/little-backup-box>

		<FilesMatch "\.(sh|cfg)$">
			Order Deny,Allow
			Deny from all
		</FilesMatch>

		<FilesMatch "\.log$">
			ForceType text/plain
		</FilesMatch>

	</Directory>

	# tinyfilemanager
	Include /etc/apache2/includes/tinyfilemanager.conf

	# ProxyPass
	ProxyRequests Off

	# comitup
	Include /etc/apache2/includes/comitup.conf

	# portal page
	Include /etc/apache2/includes/portalpage.conf

	# rclone gui
	Include /etc/apache2/includes/rclone_gui.conf

	# log
	SetEnvIf Remote_Addr "127\.0\.0\.1" dontlog

	ErrorLog ${APACHE_LOG_DIR}/lbb-error.log
	CustomLog ${APACHE_LOG_DIR}/lbb-access.log combined env=!dontlog
</VirtualHost>

<VirtualHost *:443>
	DocumentRoot /var/www/little-backup-box/

	# ssl
	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/little-backup-box.crt
	SSLCertificateKeyFile /etc/ssl/private/little-backup-box.key

	<Location />
		include /etc/apache2/includes/password.conf
	</Location>

	<Directory /var/www/little-backup-box>

		<FilesMatch "\.(sh|cfg)$">
			Order Deny,Allow
			Deny from all
		</FilesMatch>

		<FilesMatch "\.log$">
			ForceType text/plain
		</FilesMatch>

	</Directory>

	# tinyfilemanager
	Include /etc/apache2/includes/tinyfilemanager.conf

	# ProxyPass
	ProxyRequests Off

	# comitup
	Include /etc/apache2/includes/comitup.conf

	# portal page
	Include /etc/apache2/includes/portalpage.conf

	# rclone gui
	Include /etc/apache2/includes/rclone_gui.conf

	# log
	SetEnvIf Remote_Addr "127\.0\.0\.1" dontlog

	ErrorLog ${APACHE_LOG_DIR}/lbb-error.log
	CustomLog ${APACHE_LOG_DIR}/lbb-access.log combined env=!dontlog
</VirtualHost>
